# Static ntfy config -- values that never change per deploy.
# Runtime port + base URL are set as environment variables in
# entrypoint.sh at boot.
#
# Full config reference: https://docs.ntfy.sh/config/

# In-memory message cache. 12h means a phone that's been offline can
# catch up when it wakes; long enough for realistic sleep + travel.
# Path is inside /tmp so Railway's ephemeral FS is fine -- messages
# older than the cache duration are just gone, which is what we want
# for payment notifications anyway.
cache-file: "/tmp/ntfy-cache.db"
cache-duration: "12h"

# Public topic like ntfy.sh -- anyone who knows the topic name can
# publish and subscribe. Same trust model as the previous ntfy.sh
# setup; the topic name itself is the secret.
#
# If topic-name leaks and starts getting sprayed with junk, either
# rotate NTFY_TOPIC everywhere (Web1/Backend + phone app) or flip on
# auth-default-access here.
auth-default-access: "read-write"

# Behind Railway's load balancer, which terminates TLS at the edge
# and forwards HTTP. Trust X-Forwarded-For so access logs record the
# real caller IP rather than the LB's internal address.
behind-proxy: true

# Attachments disabled -- we only send text and storing binary blobs
# on an ephemeral container is a footgun.
attachment-cache-dir: ""

# Web UI at the root so hitting the domain in a browser shows the
# ntfy dashboard rather than a bare 404 -- also lets you subscribe /
# publish from the browser during setup.
web-root: "app"
